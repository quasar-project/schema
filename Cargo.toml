[package]
name = "quasar_schema"
version = "2.0.0"
edition = "2024"
authors = ["whs31 <whs31@github.io>"]
keywords = ["protocol", "network", "uav", "protobuf"]
license = "MIT OR Apache-2.0"

[lib]
doctest = false

[features]
default = []
serde = ["dep:serde", "wkt", "mms_ipc_core/serde"]
legacy = ["mms_ipc_core/legacy"]
wkt = []
vendored-protobuf = ["dep:protobuf-src", "mms_ipc_core/vendored-protobuf"]


[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
mms_ipc_core = { version = "3.1.1", registry = "whs31" }

prost = { version = "0.14", features = ["default"] }
prost-types = { version = "0.14", features = ["chrono"] }

serde = { version = "1.0", features = ["derive"], optional = true }

[build-dependencies]
prost-build = "0.14"
protobuf-src = { version = "2", optional = true }
mms_ipc_core = { version = "3.1.1", registry = "whs31" }
