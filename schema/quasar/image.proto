syntax = "proto3";

import public "google/protobuf/duration.proto";

import public "radar/mms/common/angle.proto";
import public "radar/mms/common/dim.proto";
import public "radar/mms/common/distance.proto";
import public "radar/mms/common/latlon.proto";
import public "radar/mms/common/velocity.proto";

package quasar.pb;

enum ImageType {
  IMAGE_TYPE_TELESCOPIC = 0;
  IMAGE_TYPE_STRIP = 1;
}

enum RadarRampType {
  RADAR_RAMP_TYPE_UNSPECIFIED = 0;
  RADAR_RAMP_TYPE_SAW = 1;
  RADAR_RAMP_TYPE_TRIANGULAR = 2;
}

message RadarSignalParameters {
  uint32 capture_mode = 1;
  uint32 sampling_frequency_hz = 2;
  uint32 period_sample_count = 3;
  uint32 sync_pause_sample_count = 4;
  uint64 initial_frequency_hz = 5;
  uint32 bandwidth_hz = 6;
  uint32 modulation_duration_ns = 7;
  RadarRampType ramp_type = 8;
}

message ImageMetadata {
  reserved 1, 3, 4, 5, 6, 9, 10, 19, 21, 30;
  reserved "filename", "uuid", "type", "latitude", "longitude", "dx", "dy", "x0", "y0", "lx", "ly", "azimuth",
    "fic", "timestamp", "sar_mode", "valid_checksum";

  ImageType image_type = 2;
  radar.mms.pb.Distance near_edge = 7;
  radar.mms.pb.Distance frame_offset = 8;
  radar.mms.pb.Angle angle = 11;
  radar.mms.pb.Angle drift_angle = 12;
  radar.mms.pb.Angle divergence_angle = 13;
  radar.mms.pb.Velocity velocity = 14;
  radar.mms.pb.Distance altitude = 15;
  float frequency_interpolation_coefficient = 16;
  google.protobuf.Duration time_offset = 17;
  google.protobuf.Duration time_duration = 18;
  uint32 mode = 20;
  radar.mms.pb.LatLon coordinate = 22;
  radar.mms.pb.Dim2 pixel_size = 23;
  radar.mms.pb.Dim2 size = 24;
  optional RadarSignalParameters radar = 25;
  optional uint32 crc = 26;
}

message Image {
  ImageMetadata metadata = 1;
  bytes image_data = 2;
}
